<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Tough Stream Hub</title>

<style>
body{
  margin:0;
  font-family: Arial, sans-serif;
  background:#0b0b0f;
  color:white;
  overflow-x:hidden;
}

/* ===== BACKGROUND ===== */
body::before{
  content:"";
  position:absolute;
  width:900px;
  height:900px;
  background:radial-gradient(circle,
    rgba(255,0,0,0.25),
    transparent 60%);
  top:-200px;
  left:-200px;
  filter:blur(70px);
  z-index:0;
}

body::after{
  content:"";
  position:absolute;
  width:900px;
  height:900px;
  background:radial-gradient(circle,
    rgba(140,0,255,0.15),
    transparent 60%);
  bottom:-250px;
  right:-250px;
  filter:blur(90px);
  z-index:0;
}

.vignette{
  position:fixed;
  inset:0;
  background:radial-gradient(circle,
    transparent 0%,
    rgba(0,0,0,0.6) 70%,
    rgba(0,0,0,0.95) 100%);
  z-index:1;
}

/* ===== HEADER ===== */
.container{
  position:relative;
  z-index:2;
  text-align:center;
  padding-top:70px;
}

h1{
  font-size:44px;
  margin:0;
}

p{
  opacity:0.7;
}

/* ===== BUTTONS ===== */
.btn{
  display:inline-block;
  margin:10px;
  padding:14px 24px;
  border-radius:14px;
  text-decoration:none;
  color:white;
  font-weight:600;
  transition:0.25s;
}

.yt{background:linear-gradient(180deg,#ff2a2a,#cc0000);}
.tg{background:linear-gradient(180deg,#2aa7ff,#0a66c2);}
.tt{background:linear-gradient(180deg,#111,#444);}
.ref{background:linear-gradient(180deg,#7a2cff,#4a00ff);}

.btn:hover{
  transform:translateY(-2px);
  box-shadow:0 0 25px rgba(255,0,0,0.4);
}

/* ===== STREAM + CHAT ===== */
.stream-layout{
  width:85%;
  margin:50px auto;
  display:flex;
  gap:20px;
  position:relative;
  z-index:2;
}

.stream-box{
  flex:2;
  border-radius:16px;
  overflow:hidden;
  border:1px solid rgba(255,255,255,0.08);
  box-shadow:0 0 40px rgba(255,0,0,0.2);
}

.yt-player{
  width:100%;
  height:520px;
}

.chat-box{
  flex:1;
  border-radius:16px;
  overflow:hidden;
  border:1px solid rgba(255,255,255,0.08);
  box-shadow:0 0 25px rgba(140,0,255,0.15);
}

.chat-box iframe{
  width:100%;
  height:520px;
}

/* ===== SHORTS ===== */
.portfolio{
  position:relative;
  z-index:2;
  width:85%;
  margin:80px auto;
  text-align:center;
}

.portfolio h2{
  font-size:28px;
  margin-bottom:20px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:16px;
}

.card{
  border-radius:14px;
  overflow:hidden;
  border:1px solid rgba(255,255,255,0.08);
  transition:0.3s;
}

.card:hover{
  transform:scale(1.05);
  box-shadow:0 0 30px rgba(255,0,0,0.3);
}

.card iframe{
  width:100%;
  height:320px;
}

/* ===== RESPONSIVE ===== */
@media(max-width:900px){
  .stream-layout{
    flex-direction:column;
  }

  .yt-player,
  .chat-box iframe{
    height:350px;
  }

  .grid{
    grid-template-columns:repeat(2,1fr);
  }
}

@media(max-width:500px){
  .grid{
    grid-template-columns:1fr;
  }
}
</style>

</head>

<body>

<div class="vignette"></div>

<!-- HEADER -->
<div class="container">

  <h1>Tough Stream</h1>
  <p>Lineage 2 • Live Hub</p>

  <div>
    <a class="btn yt" href="https://www.youtube.com/@ToughW8" target="_blank">YouTube</a>
    <a class="btn tg" href="https://t.me/ToughL2" target="_blank">Telegram</a>
    <a class="btn ref" href="https://bohpts.com/register?ref=Tough" target="_blank">BoHpts x7</a>
    <a class="btn tt" href="https://www.tiktok.com/@qtough" target="_blank">TikTok</a>
  </div>

</div>

<!-- STREAM + CHAT -->
<div class="stream-layout">

  <div class="stream-box">
    <iframe
      class="yt-player"
      src="https://www.youtube.com/embed/live_stream?channel=UC2Jm1am3UY__oIF0yUDm9Jg"
      frameborder="0"
      allowfullscreen>
    </iframe>
  </div>

  <div class="chat-box">
    <iframe
      src="https://www.youtube.com/live_chat?v=LIVE_VIDEO_ID&embed_domain=localhost"
      frameborder="0">
    </iframe>
  </div>

</div>

<!-- SHORTS -->
<div class="portfolio">

  <h2>Shorts Portfolio</h2>

  <div class="grid">

    <div class="card">
      <iframe src="https://www.youtube.com/embed/Tx9MEplF2os"></iframe>
    </div>

    <div class="card">
      <iframe src="https://www.youtube.com/embed/-JzIcoWKPg0"></iframe>
    </div>

    <div class="card">
      <iframe src="https://www.youtube.com/embed/6wuxZJdJfO4"></iframe>
    </div>

    <div class="card">
      <iframe src="https://www.youtube.com/embed/b3kCvdzf2YI"></iframe>
    </div>

  </div>

</div>

</body>
</html>
