<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Tough Stream</title>

<style>
body{
  margin:0;
  font-family: Arial, sans-serif;
  background:#0b0b0f;
  overflow:hidden;
  color:white;
}

/* 🔴 главный красный glow */
body::before{
  content:"";
  position:absolute;
  width:900px;
  height:900px;
  background:radial-gradient(circle,
    rgba(255,0,0,0.25),
    transparent 60%);
  top:-200px;
  left:-200px;
  filter:blur(70px);
  z-index:0;
}

/* 🟣 второй фиолетовый glow */
body::after{
  content:"";
  position:absolute;
  width:900px;
  height:900px;
  background:radial-gradient(circle,
    rgba(140,0,255,0.15),
    transparent 60%);
  bottom:-250px;
  right:-250px;
  filter:blur(90px);
  z-index:0;
}

/* 🌫 виньетка */
.vignette{
  position:fixed;
  inset:0;
  background:radial-gradient(circle,
    transparent 0%,
    rgba(0,0,0,0.6) 70%,
    rgba(0,0,0,0.95) 100%);
  z-index:1;
}

/* центр контент */
.container{
  position:relative;
  z-index:2;
  text-align:center;
  top:20vh;
}

/* кнопки */
.btn{
  display:inline-block;
  margin:10px;
  padding:14px 26px;
  border-radius:14px;
  text-decoration:none;
  color:white;
  font-weight:600;
  background:linear-gradient(180deg,#ff2a2a,#a80000);
  box-shadow:0 0 20px rgba(255,0,0,0.4);
  transition:0.25s;
}

.btn:hover{
  transform:translateY(-2px);
  box-shadow:0 0 35px rgba(255,0,0,0.7);
}

/* разные цвета под соцсети */
.tg{background:linear-gradient(180deg,#2aa7ff,#0a66c2);}
.yt{background:linear-gradient(180deg,#ff2a2a,#cc0000);}
.tt{background:linear-gradient(180deg,#111,#444);}
.ref{background:linear-gradient(180deg,#7a2cff,#4a00ff);}
</style>
</head>

<body>

<div class="vignette"></div>

<div class="container">

  <h1>Tough Stream</h1>
  <p>Lineage 2 • Live Stream Hub</p>

  <div>
    <a class="btn yt" href="https://www.youtube.com/@ToughW8" target="_blank">YouTube</a>
    <a class="btn tg" href="https://t.me/ToughL2" target="_blank">Telegram</a>
    <a class="btn ref" href="https://bohpts.com/register?ref=Tough" target="_blank">BoHpts x7 Рефералка</a>
    <a class="btn tt" href="https://www.tiktok.com/@qtough" target="_blank">TikTok</a>
  </div>

</div>

</body>
</html>
